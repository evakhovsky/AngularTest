<section class="card">
  <h2>{{ title() }}</h2>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <p-tree
    [value]="nodes()"
    [lazy]="true"
    [loading]="loading()"
    (onNodeExpand)="onNodeExpand($event)"
  >
    <ng-template pTemplate="default" let-node>
      <button
        class="tree-record"
        type="button"
        (click)="$event.stopPropagation(); selectNode(node)"
      >
        {{ node.data.name }} ({{ node.data.birthYear }}) — {{ node.data.generationTitle }}
      </button>
    </ng-template>
  </p-tree>
</section>
